# Opens a release PR from Conventional Commits on main; merging it tags the version and publishes a GitHub Release
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # The org ruleset blocks tag creation by the built-in token; this token's owner must be allowed to create tags.
          # Falls back to the built-in token, which can open release PRs but not publish releases.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
